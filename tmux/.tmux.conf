set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

set -g default-terminal "tmux-256color"
set-option -g history-limit 5000

# used for numbering windows and panes to start with 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind r
bind r source-file ~/.tmux.conf; display "Reloaded!"

unbind C-b # unbind original leader key
set -g prefix C-s
bind-key C-s send-prefix

# unbind C-Space
# set -g prefix C-Space
# bind C-Space send-prefix

# act like vim
# bind-key h select-pane -L
# setw -g mode-keys vi
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z 5


set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery' # relied on by catppuccin_status_battery
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'

# Catppuccin settings

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_left_separator " "
# set -g @catppuccin_window_fill "all"

set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_background "default"

set -g @catppuccin_pane_status_enabled "yes"

set -g @catppuccin_date_time_text "%a, %B %-d, %I:%M%p" # format specifiers is strftime

# set -g @catppuccin_status_default "on"
# set -g @catppuccin_status_bg "default"


set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Status bar
set-option -g status-position top
set -g status-right-length 150
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# set -ag status-right "#{E:@catppuccin_status_user}"
# set -ag status-right "#{E:@catppuccin_status_host}"
# set -ag status-right "#{E:@catppuccin_status_battery}" # not working right now for whatever reason
# set -g status-bg default
# set -g window-style "bg=default"
# set -g window-active-style "bg=default"

# set -g @themepack 'powerline/double/cyan'

# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'
# set -s escape-time 0

# Keybinds for plugins
set -g @sessionx-bind 'o'


run-shell ~/.tmux/plugins/tmux-battery/battery.tmux

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
